name: form-development

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: form
      POSTGRES_USER: form
      POSTGRES_PASSWORD: form
    ports:
      - "45432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U form -d form"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - form-postgres-development:/var/lib/postgresql/data

  object-storage:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: form
      MINIO_ROOT_PASSWORD: form-development-secret
    ports:
      - "49000:9000"
      - "49001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - form-object-storage-development:/data

volumes:
  form-postgres-development:
  form-object-storage-development:
