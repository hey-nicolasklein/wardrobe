name: form-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: form
      POSTGRES_USER: form
      POSTGRES_PASSWORD: form-local-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - form-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U form -d form"]
      interval: 2s
      timeout: 3s
      retries: 20

  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: form
      MINIO_ROOT_PASSWORD: form-local-only-secret
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - form-object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  form-postgres-data:
  form-object-data:
