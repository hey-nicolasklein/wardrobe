name: form-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-form}
      POSTGRES_USER: ${POSTGRES_USER:-form}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - ${FORM_DATA_DIR:?Set FORM_DATA_DIR in .env.production}/postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.production}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.production}
    volumes:
      - ${FORM_DATA_DIR:?Set FORM_DATA_DIR in .env.production}/object-storage:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-form}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-form}
      S3_ENDPOINT: http://object-storage:9000
      S3_PUBLIC_ENDPOINT: ${PUBLIC_WEB_ORIGIN:?Set PUBLIC_WEB_ORIGIN in .env.production}
      API_HOST: 0.0.0.0
      API_PORT: 4143
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    ports:
      - "127.0.0.1:4143:4143"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4143/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-form}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-form}
      S3_ENDPOINT: http://object-storage:9000
      S3_PUBLIC_ENDPOINT: ${PUBLIC_WEB_ORIGIN:?Set PUBLIC_WEB_ORIGIN in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        EXPO_PUBLIC_API_URL: ${PUBLIC_WEB_ORIGIN:?Set PUBLIC_WEB_ORIGIN in .env.production}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FORM_WEB_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
