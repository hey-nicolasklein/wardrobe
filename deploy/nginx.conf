resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_backend {
  zone api_backend 64k;
  server api:4143 resolve;
}

upstream object_storage_backend {
  zone object_storage_backend 64k;
  server object-storage:9000 resolve;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Tailscale Serve/Funnel appends the real client to X-Forwarded-For and reaches
  # nginx through the Docker gateway. Trusting only private hops means a client
  # can't choose its own address by sending X-Forwarded-For itself.
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location /v1/ {
    client_max_body_size 25m;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /health/ {
    proxy_pass http://api_backend;
    proxy_set_header Host $http_host;
  }

  location /form-private-media/ {
    proxy_pass http://object_storage_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
